  nota: "Revisado contra MUNUS YAML Spec v1.1: archivo mínimo de 3 bloques. Sin opciones, sin rúbricas, sin números de cita. Sin cambios de contenido."

contenido:
  - id: invitacion_oremos
    tipo: monicion
    actor: celebrante
    obligatorio: true
    texto: "Oremos."

  - id: oracion_antes_bendicion
    tipo: oracion
    actor: celebrante
    obligatorio: true
    texto: "Oh Dios, que en este sacramento admirable nos dejaste el memorial de tu pasión, te pedimos nos concedas venerar de tal modo los sagrados misterios de tu Cuerpo y de tu Sangre, que experimentemos constantemente en nosotros el fruto de tu redención. Tú que vives y reinas por los siglos de los siglos."

  - id: respuesta_amen
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."
