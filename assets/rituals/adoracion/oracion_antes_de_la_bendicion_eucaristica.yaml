id: oracion_antes_de_la_bendicion_eucaristica

metadata:
  titulo: "Oración antes de la bendición eucarística"
  tipo: bendicion
  libro: "Ritual del Culto Eucarístico fuera de la Misa"
  parte: ~
  capitulo: ~
  numeros:
    inicio: 38
    fin: 38
  ministros: [sacerdote, diacono]
  idioma: es
