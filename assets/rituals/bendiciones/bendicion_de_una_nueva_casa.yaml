id: bendicion_de_una_nueva_casa

metadata:
  titulo: "Bendición de una nueva casa"
  tipo: bendicion
  libro: "Bendicional"
  parte: "Segunda"
  capitulo: "X"
  numeros:
    inicio: 534
    fin: 552
  ministros: [sacerdote, diacono]
  idioma: es
  version: 5
  nota: "v5: auditoría de consistencia de selectores. Se quitaron puntos suspensivos colgantes en 2 display_name de lectura (opcion_gn_18_1_10a, opcion_mc_1_29_31). Se agregó display_name a las 2 opciones de salmo_responsorial_126, que no lo tenían (tomado del estribillo de cada una) — pendiente confirmar con Programming si el selector de tipo: salmo efectivamente muestra el botón de opciones en la UI actual. v4: lectura_evangelio se reestructuró con Regla 3.2 para corregir la aclamación tras la lectura, que dependía del género de la lectura elegida. Las 6 lecturas (la que era 'principal', Lc 10,5-9, más las 5 alternativas) pasaron a ser 6 opciones de igual rango, cada una con su propio elementos agrupando lectura + proclamación (tipo: saludo, actor: lector) + respuesta (tipo: respuesta, actor: asamblea). 5 de las 6 son evangélicas ('Palabra del Señor.' / 'Gloria a ti, Señor Jesús.'); Gn 18,1-10a es la única no evangélica ('Palabra de Dios.' / 'Te alabamos, Señor.'). Se eliminó el bloque suelto respuesta_palabra_del_senor, que antes traía mal el actor (asamblea en vez de lector) y no distinguía género de lectura. El bloque padre lectura_evangelio quedó sin texto propio, como corresponde cuando todas las opciones son de igual rango. v3: se completaron las 5 lecturas alternativas de lectura_evangelio (Gn 18,1-10a / Mc 1,29-31 / Lc 10,38-42 / Lc 19,1-9 / Lc 24,28-32), transcriptas por Ricardo desde el Bendicional/Leccionario. Cada opción quedó con encabezado y texto completos; se retiraron los comentarios # PENDIENTE. Se corrigió la referencia de la segunda opción de Mc 1,29-30 a Mc 1,29-31 (el texto transcripto llega hasta el v. 31, 'y la levantó... se puso a servirles'). v2 (migración a v1.1): no se encontraron casos de Regla 3.2 (todas las alternativas del archivo — lectura y salmo — son variantes de contenido simple, no de forma litúrgica), por lo que la estructura de opciones no cambió. Se retiraron los números de cita del libro al inicio de las rúbricas (se conservan en praenotanda, que reproduce el texto introductorio completo del libro). Se revisó obligatorio: solo queda true la rúbrica de la aspersión (acción física concreta sobre personas/lugar); las de postura (manos extendidas/juntas) pasan a false."

praenotanda: |
  534. Cuando los cristianos desean inaugurar una nueva casa invocando la protección divina, el pastor de almas y sus cooperadores accederán de buen grado a este deseo, ya que con ello se les ofrece una magnífica ocasión de entrar en contacto con aquellos fieles. Así, juntos y con alegría, dan gracias a Dios, de quien procede todo bien, por el don de una nueva vivienda.

  535. El rito que aquí se propone pueden utilizarlo el sacerdote, el diácono, y también el laico, con los ritos y fórmulas previstos para él.

  536. Con el fin de acomodar la celebración a las circunstancias del lugar y de los que viven en la casa, pueden adaptarse algunos de los elementos de este rito, respetando siempre la estructura de la celebración y sus elementos principales.

  537. No debe hacerse la bendición de la nueva casa sin la presencia de los que en ella viven.

contenido:
  - id: rubrica_titulo_rito
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Rito de la bendición — Ritos iniciales"

  - id: rubrica_538
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Reunidos en el lugar adecuado los miembros de la familia con sus parientes y amigos, el ministro dice:"

  - id: saludo_inicial_trinitario
    tipo: saludo
    actor: celebrante
    obligatorio: true
    texto: "En el nombre del Padre, y del Hijo, y del Espíritu Santo."

  - id: rubrica_signan_responden
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Todos se santiguan y responden:"

  - id: respuesta_amen_538
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_539
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "El ministro, si es sacerdote o diácono, saluda a los presentes, diciendo:"

  - id: saludo_celebrante_539
    tipo: saludo
    actor: celebrante
    obligatorio: true
    texto: "La paz del Señor a esta casa y a todos los aquí presentes."

  - id: rubrica_otras_palabras_539
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "U otras palabras adecuadas, tomadas preferentemente de la sagrada Escritura."

  - id: rubrica_todos_responden_539
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Todos responden:"

  - id: respuesta_y_con_tu_espiritu_539
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Y con tu espíritu."

  - id: rubrica_otro_modo_539
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "O de otro modo adecuado."

  - id: rubrica_541
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Luego dispone a los presentes para la celebración, con estas palabras u otras semejantes:"

  - id: monicion_541
    tipo: monicion
    actor: celebrante
    obligatorio: true
    texto: "Queridos hermanos, dirijamos nuestra ferviente oración a Cristo, que quiso nacer de la Virgen María y habitó entre nosotros, para que se digne entrar en esta casa y bendecirla con su presencia.\n\nCristo, el Señor, esté aquí, en medio de vosotros, fomente vuestra caridad fraterna, participe en vuestras alegrías, os consuele en vuestras tristezas, y vosotros, guiados por las enseñanzas y ejemplos de Cristo, procurad, ante todo, que esta nueva casa sea hogar de caridad, desde donde se difunda ampliamente la fragancia de Cristo."

  - id: rubrica_titulo_lectura
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Lectura de la Palabra de Dios"

  - id: rubrica_542
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Luego uno de los presentes o el mismo ministro, lee un texto de la Sagrada Escritura."

  - id: lectura_evangelio
    tipo: lectura
    actor: lector
    obligatorio: true
    opciones:
      - id: opcion_lc_10_5_9
        display_name: "Paz a esta casa"
        elementos:
          - id: lectura_lc_10_5_9_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Lc 10, 5-9"
            encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Lucas. Lc 10, 5-9: Paz a esta casa"
            texto: |
              Dijo el Señor a sus discípulos:

              —«Cuando entréis en una casa, decid primero: "Paz en esta casa." Y si allí hay gente de paz, descansará sobre ellos vuestra paz; si no, volverá a vosotros. Quedaos en la misma casa, comed y bebed de lo que tengan, porque el obrero merece su salario. No andéis cambiando de casa en casa. Si entráis en un pueblo y os reciben bien, comed lo que os pongan, curad a los enfermos que haya, y decid: "Está cerca de vosotros el reino de Dios."»
          - id: proclamacion_lc_10_5_9
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra del Señor."
          - id: respuesta_lc_10_5_9
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Gloria a ti, Señor Jesús."

      - id: opcion_gn_18_1_10a
        display_name: "Señor, no pases de largo"
        elementos:
          - id: lectura_gn_18_1_10a_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Gn 18, 1-10a"
            encabezado: "Lectura del libro del Génesis. «Señor, no pases de largo junto a tu siervo»."
            texto: |
              En aquellos días, el Señor se apareció a Abrahán junto a la encina de Mambré, mientras él estaba sentado a la puerta de la tienda, en lo más caluroso del día. Alzó la vista y vio tres hombres frente a él. Al verlos, corrió a su encuentro desde la puerta de la tienda, se postró en tierra y dijo:

              «Señor mío, si he alcanzado tu favor, no pases de largo junto a tu siervo. Haré que traigan agua para que os lavéis los pies y descanséis junto al árbol. Mientras, traeré un bocado de pan para que recobréis fuerzas antes de seguir, ya que habéis pasado junto a la casa de vuestro siervo».

              Contestaron:

              «Bien, haz lo que dices».

              Abrahán entró corriendo en la tienda donde estaba Sara y le dijo:

              «Aprisa, prepara tres cuartillos de flor de harina, amásalos y haz unas tortas».

              Abrahán corrió enseguida a la vacada, escogió un ternero hermoso y se lo dio a un criado para que lo guisase de inmediato. Tomó también cuajada, leche y el ternero guisado y se lo sirvió. Mientras él estaba bajo el árbol, ellos comían.

              Después le dijeron:

              «¿Dónde está Sara, tu mujer?».

              Contestó:

              «Aquí, en la tienda».

              Y uno añadió:

              «Cuando yo vuelva a verte, dentro del tiempo de costumbre, Sara habrá tenido un hijo».
          - id: proclamacion_gn_18_1_10a
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra de Dios."
          - id: respuesta_gn_18_1_10a
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Te alabamos, Señor."

      - id: opcion_mc_1_29_31
        display_name: "Él se acercó, la cogió de la mano"
        elementos:
          - id: lectura_mc_1_29_31_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Mc 1, 29-31"
            encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Marcos. «Él se acercó, la cogió de la mano y la levantó»."
            texto: |
              Y enseguida, al salir ellos de la sinagoga, fue con Santiago y Juan a la casa de Simón y Andrés. La suegra de Simón estaba en cama con fiebre, e inmediatamente le hablaron de ella. Él se acercó, la cogió de la mano y la levantó. Se le pasó la fiebre y se puso a servirles. Al anochecer, cuando se puso el sol, le llevaron todos los enfermos y endemoniados. La población entera se agolpaba a la puerta.
          - id: proclamacion_mc_1_29_31
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra del Señor."
          - id: respuesta_mc_1_29_31
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Gloria a ti, Señor Jesús."

      - id: opcion_lc_10_38_42
        display_name: "Marta lo recibió en su casa"
        elementos:
          - id: lectura_lc_10_38_42_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Lc 10, 38-42"
            encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Lucas. «Marta lo recibió en su casa»."
            texto: |
              En aquel tiempo, entró Jesús en una aldea, y una mujer llamada Marta lo recibió en su casa.

              Esta tenía una hermana llamada María, que, sentada a los pies del Señor, escuchaba su palabra.

              Marta, en cambio, se multiplicaba para dar abasto con el servicio; hasta que se paró y dijo:

              —«Señor, ¿no te importa que mi hermana me haya dejado sola con el servicio? Dile que me eche una mano».

              Pero el Señor le contestó:

              —«Marta, Marta, andas inquieta y preocupada con muchas cosas; solo una es necesaria. María, pues, ha escogido la parte mejor, y no le será quitada».
          - id: proclamacion_lc_10_38_42
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra del Señor."
          - id: respuesta_lc_10_38_42
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Gloria a ti, Señor Jesús."

      - id: opcion_lc_19_1_9
        display_name: "Hoy ha sido la salvación de esta casa"
        elementos:
          - id: lectura_lc_19_1_9_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Lc 19, 1-9"
            encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Lucas. «Hoy ha sido la salvación de esta casa»."
            texto: |
              En aquel tiempo, Jesús entró en Jericó e iba atravesando la ciudad.

              En esto, un hombre llamado Zaqueo, jefe de publicanos y rico, trataba de distinguir quién era Jesús, pero la gente se lo impedía, porque era bajo de estatura.

              Corrió más adelante y se subió a una higuera para verlo, porque tenía que pasar por allí.

              Jesús, al llegar a aquel sitio, levantó los ojos y le dijo:

              —«Zaqueo, baja en seguida, porque hoy tengo que alojarme en tu casa».

              Él bajó en seguida y lo recibió muy contento.

              Al ver esto, todos murmuraban diciendo:

              —«Ha entrado a hospedarse en casa de un pecador».

              Pero Zaqueo, de pie, dijo al Señor:

              —«Mira, la mitad de mis bienes, Señor, se la doy a los pobres; y si he defraudado a alguno, le restituyo cuatro veces más».

              Jesús le dijo:

              —«Hoy ha sido la salvación de esta casa, pues también este es hijo de Abrahán».
          - id: proclamacion_lc_19_1_9
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra del Señor."
          - id: respuesta_lc_19_1_9
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Gloria a ti, Señor Jesús."

      - id: opcion_lc_24_28_32
        display_name: "Quédate con nosotros"
        elementos:
          - id: lectura_lc_24_28_32_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Lc 24, 28-32"
            encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Lucas. «Quédate con nosotros»."
            texto: |
              Cerca ya de la aldea donde iban, Jesús hizo ademán de seguir adelante.

              Pero ellos le apremiaron, diciendo:

              —«Quédate con nosotros, porque atardece y el día va de caída».

              Y entró para quedarse con ellos.

              Sentado a la mesa con ellos, tomó el pan, pronunció la bendición, lo partió y se lo iba dando.

              A ellos se les abrieron los ojos y lo reconocieron.

              Pero él desapareció de su vista.

              Y se dijeron el uno al otro:

              —«¿No ardía nuestro corazón mientras nos hablaba por el camino y nos explicaba las Escrituras?».
          - id: proclamacion_lc_24_28_32
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra del Señor."
          - id: respuesta_lc_24_28_32
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Gloria a ti, Señor Jesús."

  - id: rubrica_544
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Según las circunstancias, se puede decir o cantar un salmo responsorial u otro canto adecuado."

  - id: salmo_responsorial_126
    tipo: salmo
    actor: lector
    obligatorio: false
    referencia: "Sal 126 (127), 1. 2. 3-4. 5 (R.: cf. 1)"
    estribillo: "El Señor nos construya la casa."
    estrofas:
      - "Si el Señor no construye la casa, en vano se cansan los albañiles; si el Señor no guarda la ciudad, en vano vigilan los centinelas."
      - "Es inútil que madruguéis, que veléis hasta muy tarde, que comáis el pan de vuestros sudores: ¡Dios lo da a sus amigos mientras duermen!"
      - "La herencia que da el Señor son los hijos; su salario, el fruto del vientre: son saetas en mano de un guerrero los hijos de la juventud."
      - "Dichoso el hombre que llena con ellas su aljaba: no quedará derrotado cuando litigue con su adversario en la plaza."
    opciones:
      - id: opcion_sal_111
        display_name: "Dichoso quien teme al Señor"
        referencia: "Sal 111 (112), 1-2. 3-4. 5-6. 7-8. 9"
        estribillo: "Dichoso quien teme al Señor."
      - id: opcion_sal_127
        display_name: "La bendición del hombre que teme al Señor"
        referencia: "Sal 127 (128), 1-2. 3. 4-6a"
        estribillo: "Esta es la bendición del hombre que teme al Señor."

  - id: rubrica_546
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "El ministro, según las circunstancias, exhorta brevemente a los presentes, explicándoles la lectura bíblica, para que perciban por la fe el significado de la celebración."

  - id: rubrica_titulo_preces
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Preces"

  - id: rubrica_547
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Sigue la plegaria común. Entre las invocaciones que aquí se proponen, el ministro puede seleccionar las que le parezcan más adecuadas o añadir otras más directamente relacionadas con las circunstancias de los presentes o del lugar."

  - id: preces_bendicion_casa
    tipo: preces
    actor: celebrante
    obligatorio: true
    invitacion: "Con ánimo agradecido y gozoso invoquemos al Hijo de Dios, Señor de cielo y tierra, que, hecho hombre, habitó entre nosotros, y digamos:"
    respuesta_fija: "Quédate con nosotros, Señor."
    invocaciones:
      - invocacion: "Señor Jesucristo, que con María y José santificaste la vida doméstica, dígnate convivir con nosotros en esta casa, para que te reconozcamos como huésped y te honremos como cabeza."
        respuesta: "Quédate con nosotros, Señor."
      - invocacion: "Tú, por quien todo el edificio queda ensamblado, y se va levantando hasta formar un templo consagrado, haz que los habitantes de esta casa se vayan integrando en la construcción, para ser morada de Dios, por el Espíritu."
        respuesta: "Quédate con nosotros, Señor."
      - invocacion: "Tú que enseñaste a tus fieles a edificar su casa sobre piedra firme, haz que la vida de esta familia se apoye firmemente en tu palabra y, evitando toda división, te sirva con generosidad y de todo corazón."
        respuesta: "Quédate con nosotros, Señor."
      - invocacion: "Tú que, careciendo de morada propia, aceptaste con el gozo de la pobreza la hospitalidad de los amigos, haz que todos los que buscan vivienda encuentren, con nuestra ayuda, una casa digna de este nombre."
        respuesta: "Quédate con nosotros, Señor."

  - id: rubrica_titulo_oracion_bendicion
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Oración de bendición"

  - id: rubrica_548
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "El ministro, si es sacerdote o diácono, con las manos extendidas, de lo contrario, con las manos juntas, añade:"

  - id: oracion_bendicion_casa
    tipo: oracion
    actor: celebrante
    obligatorio: true
    texto: "Asiste, Señor, a estos servidores tuyos que, al inaugurar (hoy) esta vivienda, imploran humildemente tu bendición, para que, cuando vivan en ella, sientan tu presencia protectora, cuando salgan, gocen de tu compañía, cuando regresen, experimenten la alegría de tenerte como huésped, hasta que lleguen felizmente a la estancia preparada para ellos en la casa de tu Padre. Tú que vives y reinas por los siglos de los siglos."

  - id: respuesta_amen_oracion_bendicion
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_550
    tipo: rubrica
    actor: celebrante
    obligatorio: true
    texto: "Después de la oración de bendición, el ministro rocía con agua bendita a los presentes y la casa, diciendo, según las circunstancias:"

  - id: bendicion_aspersion_550
    tipo: bendicion
    actor: celebrante
    obligatorio: true
    texto: "Que esta agua nos recuerde nuestro bautismo en Cristo, que nos redimió con su muerte y resurrección."

  - id: respuesta_amen_550
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_titulo_conclusion
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Conclusión del rito"

  - id: rubrica_551
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "El ministro concluye el rito, diciendo:"

  - id: conclusion_551
    tipo: conclusion
    actor: celebrante
    obligatorio: true
    texto: "Que la paz de Cristo actúe de arbitro en nuestro corazón, la palabra de Cristo habite entre nosotros en toda su riqueza, para que todo lo que de palabra o de obra realicemos, sea todo en Nombre del Señor."

  - id: respuesta_amen_551
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_canto_final
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Es aconsejable terminar el rito con un canto adecuado."
