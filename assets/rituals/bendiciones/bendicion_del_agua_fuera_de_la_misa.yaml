id: bendicion_del_agua_fuera_de_la_misa

metadata:
  titulo: "Bendición del agua fuera de la celebración de la Misa"
  tipo: bendicion
  libro: "Bendicional"
  parte: "Tercera"
  capitulo: "XXXVI"
  numeros:
    inicio: 1223
    fin: 1234
  ministros: [sacerdote, diacono]
  idioma: es
  version: 4
  nota: "v4: lectura_evangelio se reestructuró con Regla 3.2 para corregir la aclamación tras la lectura, que dependía del género de la lectura elegida. Las 8 lecturas (la que era 'principal', Jn 7,37-39, más las 7 alternativas) pasaron a ser 8 opciones de igual rango, cada una con su propio elementos agrupando lectura + proclamación (tipo: saludo, actor: lector) + respuesta (tipo: respuesta, actor: asamblea). 3 de las 8 son evangélicas —Jn 7,37-39, Jn 5,1-6, Jn 13,3-15— ('Palabra del Señor.' / 'Gloria a ti, Señor Jesús.'); las 5 restantes —Is 12, Is 55, Si 15, Ap 7, Ap 22— no lo son ('Palabra de Dios.' / 'Te alabamos, Señor.'). Se eliminó el bloque suelto respuesta_palabra_del_senor, que antes traía mal el actor (asamblea en vez de lector) y no distinguía género de lectura. El bloque padre lectura_evangelio quedó sin texto propio, como corresponde cuando todas las opciones son de igual rango. v3: se completaron las 7 lecturas alternativas de lectura_evangelio (Is 12,1-6 / Is 55,1-11 / Si 15,1-6 / Jn 5,1-6 / Ap 7,13-17 / Ap 22,1-5 / Jn 13,3-15), transcriptas por Ricardo desde el Bendicional/Leccionario. Cada opción quedó con encabezado y texto completos; se retiraron los comentarios # PENDIENTE. En Jn 5,1-6 se conservó entre corchetes el v. 3b-4 (mención del ángel que agita el agua), tal como lo marca el Leccionario como variante textual opcional en la proclamación. v2 (migración a v1.1): la letanía (n. 1233) migró de bloque suelto a tercera opción de oracion_bendicion con elementos (Regla 3.2), por tratarse de una fórmula estructuralmente distinta (letanía vs. oración corrida). Se retiraron los números de cita del libro al inicio de las rúbricas. Se revisó obligatorio en las rúbricas: solo queda true la que describe la aspersión (acción física concreta); el resto pasan a false. Se quitó la rúbrica n. 1230 (listado de lecturas alternativas), redundante una vez que esas lecturas están modeladas como opciones."

praenotanda: |
  1223. Un elemento que gozó siempre de gran veneración en la Iglesia y constituye uno de los signos que con frecuencia usa para bendecir a los fieles es el agua. El agua ritualmente bendecida evoca en los fieles el recuerdo de Cristo, que representó para nosotros la culminación de las bendiciones divinas. Él, en efecto, que se dio a sí mismo el apelativo de «agua viva», instituyó para nosotros el bautismo, sacramento del agua, como signo de bendición salvadora.

  1224. La bendición y aspersión del agua se hace normalmente el domingo, según el rito descrito en el Misal romano (31).

  1225. Cuando la bendición del agua tiene lugar fuera de la celebración de la Misa, el sacerdote o el diácono usarán el formulario que aquí se propone, de modo que, respetando su estructura y los elementos principales, adapten la celebración a las circunstancias del momento.

contenido:
  - id: rubrica_titulo_rito
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Rito de la bendición — Ritos iniciales"

  - id: rubrica_1226
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "El celebrante empieza, diciendo:"

  - id: saludo_inicial_trinitario
    tipo: saludo
    actor: celebrante
    obligatorio: true
    texto: "En el nombre del Padre, y del Hijo, y del Espíritu Santo."

  - id: rubrica_signan_responden
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Todos se santiguan y responden:"

  - id: respuesta_amen_1226
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_1227
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Luego el celebrante saluda a los presentes, diciendo:"

  - id: saludo_celebrante_1227
    tipo: saludo
    actor: celebrante
    obligatorio: true
    texto: "Dios, que del agua y del Espíritu Santo, nos ha hecho nacer de nuevo en Cristo, esté con todos vosotros."

  - id: rubrica_otras_palabras_1227
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "U otras palabras adecuadas, tomadas preferentemente de la sagrada Escritura."

  - id: rubrica_todos_responden_1227
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Todos responden:"

  - id: respuesta_y_con_tu_espiritu_1227
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Y con tu espíritu."

  - id: rubrica_otro_modo_1227
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "O de otro modo adecuado."

  - id: rubrica_1228
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "El celebrante, según las circunstancias, dispone a los presentes para la celebración de la bendición, con estas palabras u otras semejantes:"

  - id: monicion_1228
    tipo: monicion
    actor: celebrante
    obligatorio: true
    texto: "Con esta bendición del agua, recordamos a Cristo, agua viva, así como el sacramento del bautismo, en el cual nacimos de nuevo del agua y del Espíritu Santo. Siempre, pues, que seamos rociados con esta agua o que nos santigüemos con ella al entrar en la iglesia o dentro de nuestras casas, daremos gracias a Dios por su don inexplicable, y pediremos su ayuda para vivir siempre de acuerdo con las exigencias del bautismo, sacramento de la fe, que un día recibimos."

  - id: rubrica_titulo_lectura
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Lectura de la Palabra de Dios"

  - id: rubrica_1229
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Luego uno de los presentes, o el mismo celebrante, hace una breve lectura de la sagrada Escritura."

  - id: lectura_evangelio
    tipo: lectura
    actor: lector
    obligatorio: true
    opciones:
      - id: opcion_jn_7_37_39
        display_name: "El que tenga sed, que venga a mí"
        elementos:
          - id: lectura_jn_7_37_39_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Jn 7, 37-39"
            encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Juan. Jn 7, 37-39: El que tenga sed, que venga a mí"
            texto: |
              El último día, el más solemne de las fiestas, Jesús, en pie, gritaba:

              —«El que tenga sed, que venga a mí; el que cree en mí, que beba. Como dice la Escritura: de sus entrañas manarán torrentes de agua viva.» Decía esto refiriéndose al Espíritu que habían de recibir los que creyeran en él.
          - id: proclamacion_jn_7_37_39
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra del Señor."
          - id: respuesta_jn_7_37_39
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Gloria a ti, Señor Jesús."

      - id: opcion_is_12_1_6
        display_name: "Sacaréis aguas con gozo..."
        elementos:
          - id: lectura_is_12_1_6_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Is 12, 1-6"
            encabezado: "Escuchad ahora, hermanos, las palabras del libro de Isaías. «Sacaréis aguas con gozo de las fuentes de la salvación»."
            texto: |
              Aquel día dirás:

              «Te doy gracias, Señor, porque estabas airado contra mí, pero ha cesado tu ira y me has consolado.

              Él es mi Dios y Salvador: confiaré y no temeré, porque mi fuerza y mi poder es el Señor, él fue mi salvación».

              Y sacaréis aguas con gozo de las fuentes de la salvación.

              Aquel día diréis:

              «Dad gracias al Señor, invocad su nombre, contad a los pueblos sus hazañas, proclamad que su nombre es excelso».

              Tañed para el Señor, que hizo proezas, anunciadlas a toda la tierra;

              gritad jubilosos, habitantes de Sión, porque es grande en medio de ti el Santo de Israel.
          - id: proclamacion_is_12_1_6
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra de Dios."
          - id: respuesta_is_12_1_6
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Te alabamos, Señor."

      - id: opcion_is_55_1_11
        display_name: "Oíd, sedientos todos, acudid por agua"
        elementos:
          - id: lectura_is_55_1_11_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Is 55, 1-11"
            encabezado: "Escuchad ahora, hermanos, las palabras del libro de Isaías. «Oíd, sedientos todos, acudid por agua»."
            texto: |
              Esto dice el Señor:

              «Oíd, sedientos todos, acudid por agua; venid, también los que no tenéis dinero: comprad trigo y comed, venid y comprad, sin dinero y de balde, vino y leche.

              ¿Por qué gastar dinero en lo que no alimenta y el salario en lo que no da hartura? Escuchadme atentos y comeréis bien, saborearéis platos sustanciosos.

              Inclinad vuestro oído, venid a mí: escuchadme y viviréis. Sellaré con vosotros una alianza perpetua, las misericordias firmes hechas a David: lo hice mi testigo para los pueblos, guía y soberano de naciones.

              Tú llamarás a un pueblo desconocido, un pueblo que no te conocía correrá hacia ti; porque el Señor tu Dios, el Santo de Israel te glorifica.

              Buscad al Señor mientras se deja encontrar, invocadlo mientras está cerca. Que el malvado abandone su camino, y el malhechor sus planes; que se convierta al Señor, y él tendrá piedad, a nuestro Dios, que es rico en perdón.

              Porque mis planes no son vuestros planes, vuestros caminos no son mis caminos —oráculo del Señor—. Cuanto dista el cielo de la tierra, así distan mis caminos de los vuestros, y mis planes de vuestros planes.

              Como bajan la lluvia y la nieve desde el cielo, y no vuelven allá sino después de empapar la tierra, de fecundarla y hacerla germinar, para que dé semilla al sembrador y pan al que come, así será mi palabra que sale de mi boca: no volverá a mí vacía, sino que cumplirá mi deseo y llevará a cabo mi encargo».
          - id: proclamacion_is_55_1_11
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra de Dios."
          - id: respuesta_is_55_1_11
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Te alabamos, Señor."

      - id: opcion_si_15_1_6
        display_name: "Le da a beber agua de sabiduría"
        elementos:
          - id: lectura_si_15_1_6_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Si 15, 1-6"
            encabezado: "Escuchad ahora, hermanos, las palabras del libro del Eclesiástico. «Lo alimenta con pan de inteligencia y le da a beber agua de sabiduría»."
            texto: |
              Así obra el que teme al Señor, el que observa la ley alcanza la sabiduría.

              Ella le sale al encuentro como una madre y lo acoge como una joven esposa.

              Lo alimenta con pan de inteligencia y le da a beber agua de sabiduría.

              Si se apoya en ella, no vacilará, si se aferra a ella, no quedará defraudado.

              Ella lo ensalzará sobre sus compañeros y en medio de la asamblea le abrirá la boca.

              Encontrará gozo y corona de júbilo, y un nombre eterno recibirá en herencia.
          - id: proclamacion_si_15_1_6
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra de Dios."
          - id: respuesta_si_15_1_6
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Te alabamos, Señor."

      - id: opcion_jn_5_1_6
        display_name: "¿Quieres quedar sano?"
        elementos:
          - id: lectura_jn_5_1_6_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Jn 5, 1-6"
            encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Juan. «¿Quieres quedar sano?»."
            texto: |
              Después de esto, se celebraba una fiesta de los judíos, y Jesús subió a Jerusalén.

              Hay en Jerusalén, junto a la Puerta de las Ovejas, una piscina que llaman en hebreo Betesda. Esta tiene cinco soportales, y allí estaban echados muchos enfermos, ciegos, cojos, paralíticos.

              [«que esperaban el movimiento de las aguas; pues el ángel del Señor bajaba de tiempo en tiempo a la piscina y se movía el agua y el primero que descendía a la piscina tras el movimiento de agua quedaba sano de cualquier enfermedad que tuviera».]

              Estaba también allí un hombre que llevaba treinta y ocho años enfermo.

              Jesús, al verlo echado, y sabiendo que ya llevaba mucho tiempo, le dice:

              —«¿Quieres quedar sano?».
          - id: proclamacion_jn_5_1_6
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra del Señor."
          - id: respuesta_jn_5_1_6
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Gloria a ti, Señor Jesús."

      - id: opcion_ap_7_13_17
        display_name: "Hacia fuentes de aguas vivas"
        elementos:
          - id: lectura_ap_7_13_17_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Ap 7, 13-17"
            encabezado: "Escuchad ahora, hermanos, las palabras del libro del Apocalipsis. «El Cordero los conducirá hacia fuentes de aguas vivas»."
            texto: |
              Yo, Juan, oí que uno de los ancianos me decía:

              —«Esos que están vestidos con vestiduras blancas, ¿quiénes son y de dónde han venido?».

              Yo le respondí:

              —«Señor mío, tú lo sabrás».

              Él me respondió:

              —«Esos son los que vienen de la gran tribulación: han lavado y blanqueado sus vestiduras en la sangre del Cordero.

              Por eso están ante el trono de Dios, dándole culto día y noche en su templo.

              Y el que se sienta en el trono acampará entre ellos.

              Ya no pasarán hambre ni sed, no les hará daño el sol ni el bochorno, porque el Cordero que está delante del trono los apacentará y los conducirá hacia fuentes de aguas vivas. Y Dios enjugará toda lágrima de sus ojos».
          - id: proclamacion_ap_7_13_17
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra de Dios."
          - id: respuesta_ap_7_13_17
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Te alabamos, Señor."

      - id: opcion_ap_22_1_5
        display_name: "Un río de agua de vida"
        elementos:
          - id: lectura_ap_22_1_5_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Ap 22, 1-5"
            encabezado: "Escuchad ahora, hermanos, las palabras del libro del Apocalipsis. «Me mostró un río de agua de vida»."
            texto: |
              Yo, Juan, el ángel me mostró un río de agua de vida, reluciente como el cristal, que brotaba del trono de Dios y del Cordero.

              En medio de su plaza, a un lado y otro del río, hay un árbol de vida que da doce frutos, uno cada mes. Y las hojas del árbol sirven para la curación de las naciones.

              Y no habrá maldición alguna. Y el trono de Dios y del Cordero estará en ella, y sus siervos le darán culto.

              Y verán su rostro, y su nombre está sobre sus frentes.

              Y ya no habrá más noche, y no tienen necesidad de luz de lámpara ni de luz de sol, porque el Señor Dios los iluminará y reinarán por los siglos de los siglos.
          - id: proclamacion_ap_22_1_5
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra de Dios."
          - id: respuesta_ap_22_1_5
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Te alabamos, Señor."

      - id: opcion_jn_13_3_15
        display_name: "Os he dado ejemplo..."
        elementos:
          - id: lectura_jn_13_3_15_texto
            tipo: lectura
            actor: lector
            obligatorio: true
            referencia: "Jn 13, 3-15"
            encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Juan. «Os he dado ejemplo para que lo que yo he hecho con vosotros, vosotros también lo hagáis»."
            texto: |
              En aquel tiempo, Jesús, sabiendo que el Padre había puesto todo en sus manos, que venía de Dios y a Dios volvía, se levanta de la cena, se quita el manto y, tomando una toalla, se la ciñe; luego echa agua en la jofaina y se pone a lavarles los pies a los discípulos, secándoselos con la toalla que se había ceñido.

              Llegó a Simón Pedro y este le dice:

              —«Señor, ¿lavarme los pies tú a mí?».

              Jesús le replicó:

              —«Lo que yo hago, tú no lo entiendes ahora, pero lo comprenderás más tarde».

              Pedro le dice:

              —«No me lavarás los pies jamás».

              Jesús le contestó:

              —«Si no te lavo, no tienes parte conmigo».

              Simón Pedro le dice:

              —«Señor, no solo los pies, sino también las manos y la cabeza».

              Jesús le dice:

              —«Uno que se ha bañado no necesita lavarse más que los pies, porque todo él está limpio. También vosotros estáis limpios, aunque no todos».

              Porque sabía quién lo iba a entregar; por eso dijo: «No todos estáis limpios».

              Cuando acabó de lavarles los pies, tomó el manto, se lo puso otra vez y les dijo:

              —«¿Comprendéis lo que he hecho con vosotros? Vosotros me llamáis "el Maestro" y "el Señor", y decís bien, porque lo soy. Pues si yo, el Maestro y el Señor, os he lavado los pies, también vosotros debéis lavaros los pies unos a otros: os he dado ejemplo para que lo que yo he hecho con vosotros, vosotros también lo hagáis».
          - id: proclamacion_jn_13_3_15
            tipo: saludo
            actor: lector
            obligatorio: true
            texto: "Palabra del Señor."
          - id: respuesta_jn_13_3_15
            tipo: respuesta
            actor: asamblea
            obligatorio: true
            texto: "Gloria a ti, Señor Jesús."

  - id: rubrica_titulo_oracion_bendicion
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Oración de bendición"

  - id: rubrica_1231_oremos
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Luego el celebrante dice:"

  - id: invitacion_oremos_1231
    tipo: monicion
    actor: celebrante
    obligatorio: true
    texto: "Oremos."

  - id: rubrica_1231_pausa_y_manos
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Después de una breve pausa de silencio, el celebrante, con las manos extendidas, dice la oración de bendición:"

  - id: oracion_bendicion
    tipo: oracion
    actor: celebrante
    obligatorio: true
    texto: "Bendito seas, Señor, Dios todopoderoso, que te has dignado bendecirnos y transformarnos interiormente en Cristo, agua viva de nuestra salvación; haz, te pedimos, que los que nos protegemos con la aspersión o el uso de esta agua sintamos, por la fuerza del Espíritu Santo, renovada la juventud de nuestra alma y andemos siempre en una vida nueva. Por Jesucristo, nuestro Señor."
    opciones:
      - id: alternativa_1232
        display_name: "Señor, Padre santo, dirige tu mirada..."
        texto: "Señor, Padre santo, dirige tu mirada sobre nosotros, que, redimidos por tu Hijo, hemos nacido de nuevo del agua y del Espíritu Santo en la fuente bautismal; concédenos, te pedimos, que todos los que reciban la aspersión de esta agua queden renovados en el cuerpo y en el alma y te sirvan con limpieza de vida. Por Jesucristo, nuestro Señor."
      - id: letania_bendicion_agua_1233_opcion
        display_name: "Letanía: Oh, Dios, creador de todas las cosas..."
        elementos:
          - id: letania_bendicion_agua_1233
            tipo: letania
            actor: celebrante
            obligatorio: true
            invocaciones:
              - invocacion: "Oh, Dios, creador de todas las cosas, que por el agua y el Espíritu diste forma y figura al hombre y al universo."
                respuesta: "Bendice y purifica a tu Iglesia."
              - invocacion: "Oh, Cristo, que de tu costado abierto en la cruz hiciste manar los sacramentos de salvación."
                respuesta: "Bendice y purifica a tu Iglesia."
              - invocacion: "Oh, Espíritu Santo, que, del seno bautismal de la Iglesia, nos haces renacer como nuevas criaturas."
                respuesta: "Bendice y purifica a tu Iglesia."

  - id: respuesta_amen_oracion_bendicion
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_1234_aspersion
    tipo: rubrica
    actor: celebrante
    obligatorio: true
    texto: "Después de la oración de bendición, el celebrante rocía con el agua bendecida a los presentes, diciendo, según las circunstancias:"

  - id: bendicion_aspersion_1234
    tipo: bendicion
    actor: celebrante
    obligatorio: true
    texto: "Que esta agua nos recuerde nuestro bautismo en Cristo, que nos redimió con su muerte y resurrección."

  - id: respuesta_amen_1234
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_canto_final
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Mientras, se entona un canto adecuado."
