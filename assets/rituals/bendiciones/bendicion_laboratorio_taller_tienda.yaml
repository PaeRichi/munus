id: bendicion_laboratorio_taller_tienda

metadata:
  titulo: "Bendición de un laboratorio, un taller o una tienda de comercio"
  tipo: bendicion
  libro: "Bendicional"
  parte: "Segunda"
  capitulo: "XVI"
  numeros:
    inicio: 665
    fin: 683
  ministros: [sacerdote, diacono]
  idioma: es
  version: 4
  nota: "v4: se bajaron a obligatorio: false rubrica_680 ('El celebrante, con las manos extendidas, dice la oración de bendición correspondiente al tipo de local:', rúbrica de postura), rubrica_681_aspersion (rocía sin fórmula hablada que la acompañe — solo dice 'mientras se interpreta un canto', sin 'diciendo:') y rubrica_682 ('El celebrante concluye el rito, diciendo, con las manos extendidas...', transición genérica) — mismo criterio ya aplicado en bendicion_del_agua_fuera_de_la_misa.yaml, bendicion_de_una_nueva_casa.yaml y bendicion_e_imposicion_del_escapulario.yaml. v3: se bajaron a obligatorio: false rubrica_signan_responden ('Todos se santiguan y responden:') y rubrica_todos_responden_670 ('Todos responden:'), rúbricas de cue funcional que no aportan valor pastoral al quedar siempre visibles — mismo ajuste aplicado a bendicion_objetos_piadosos.yaml y bendicion_vehiculo_y_barca.yaml. v2: se completaron las 6 lecturas alternativas de lectura_gn_1_27_31 que faltaban (opcion_mc_6_1_3 ya estaba completa y no se tocó). Se reordenó el título 'Oración de bendición': antes aparecía después del bloque 'Oremos' (rubrica sin preces / invitación / silencio); ahora aparece inmediatamente después de las preces, agrupando correctamente la sección. Se retiraron los números de cita del libro al inicio de rúbricas y títulos (se conservan en praenotanda). Sin casos de Regla 3.2."

praenotanda: |
  665. El hombre, con el trabajo asiduo de sus manos, y el desempeño de su cometido, cuida incesantemente de la creación. Por otra parte, «el progreso de las técnicas de producción y la mejor organización del comercio y de los servicios han convertido la economía en un instrumento capaz de satisfacer las nuevas necesidades de la familia humana que no dejan de acrecentarse». Existe, pues, motivo más que suficiente para bendecir aquellos lugares donde el hombre trabaja con empeño en beneficio propio y en provecho de sus semejantes.

  666. Esta celebración mira no sólo a la comunidad en cuyo beneficio se construyen los nuevos laboratorios, talleres y tiendas de comercio, sino también a los que en ellos trabajan. De ahí que en la celebración de la bendición se requiera la presencia de la comunidad o, por lo menos, de algunos de sus representantes, como también de los que de un modo u otro trabajarán en los diversos menesteres.

  667. Este rito puede utilizarlo el sacerdote o el diácono, los cuales, respetando su estructura y los elementos principales de que consta, adaptarán la celebración a las circunstancias concretas del lugar y de las personas.

  668. En aquellas regiones donde cada año, durante el tiempo pascual o en cualquier otro tiempo, parece oportuno impartir también la bendición en dichos locales, se preparará una adecuada celebración, empleando de manera conveniente los principales elementos que se indican en esta Bendición.

contenido:
  - id: rubrica_titulo_rito
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "RITO DE LA BENDICIÓN — Ritos iniciales"

  - id: rubrica_669
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Reunida la comunidad en el lugar adecuado, después de un canto conveniente el celebrante dice:"

  - id: saludo_inicial_trinitario
    tipo: saludo
    actor: celebrante
    obligatorio: true
    texto: "En el nombre del Padre, y del Hijo, y del Espíritu Santo."

  - id: rubrica_signan_responden
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Todos se santiguan y responden:"

  - id: respuesta_amen_669
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_670
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Luego el celebrante saluda a los presentes, diciendo:"

  - id: saludo_celebrante_670
    tipo: saludo
    actor: celebrante
    obligatorio: true
    texto: "Dios, que dio al hombre el mando sobre las obras de sus manos, esté con todos vosotros."

  - id: rubrica_otras_palabras_670
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "U otras palabras adecuadas, tomadas preferentemente de la Sagrada Escritura."

  - id: rubrica_todos_responden_670
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Todos responden:"

  - id: respuesta_y_con_tu_espiritu_670
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Y con tu espíritu."

  - id: rubrica_otro_modo_670
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "O de otro modo adecuado."

  - id: rubrica_671
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "El celebrante dispone a los presentes a recibir la bendición, con estas palabras u otras semejantes:"

  - id: monicion_671
    tipo: monicion
    actor: celebrante
    obligatorio: true
    texto: "Jesucristo puso de manifiesto la gran dignidad del trabajo cuando Él mismo, la Palabra del Padre hecha carne, quiso ser llamado hijo del carpintero y trabajar humildemente con sus propias manos. Así alejó la antigua maldición del pecado y convirtió el trabajo humano en fuente de bendición. En efecto, el hombre, realizando fielmente su trabajo y todo lo que se refiere al progreso temporal y ofreciéndolo humildemente a Dios, se purifica a sí mismo, desarrolla con su inteligencia y habilidad la obra de la creación, ejercita la caridad, se hace capaz de ayudar a los que son más pobres que él y, asociándose a Cristo Redentor, se perfecciona en el amor a Él. Bendigamos, pues, a Dios y pidámosle que derrame su bendición sobre todos los que desempeñen sus tareas en este lugar."

  - id: rubrica_titulo_lectura
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Lectura de la Palabra de Dios"

  - id: rubrica_672
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Luego el lector, uno de los presentes o el mismo celebrante, lee un texto de la Sagrada Escritura."

  - id: lectura_gn_1_27_31
    tipo: lectura
    actor: lector
    obligatorio: true
    referencia: "Gn 1, 27-31a"
    encabezado: "Escuchad ahora, hermanos, las palabras del libro del Génesis. «Llenad la tierra y sometedla»."
    texto: |
      Creó Dios al hombre a su imagen; a imagen de Dios lo creó; hombre y mujer los creó. Y los bendijo Dios y les dijo: «Creced, multiplicaos, llenad la tierra y sometedla; dominad los peces del mar, las aves del cielo, los vivientes que se mueven sobre la tierra». Y dijo Dios: «Mirad, os entrego todas las hierbas que engendran semilla sobre la faz de la tierra; y todos los árboles frutales que engendran semilla os servirán de alimento; y a todas las fieras de la tierra, a todas las aves del cielo, a todos los reptiles de la tierra, a todo ser que respira, la hierba verde les servirá de alimento». Y así fue. Y vio Dios todo lo que había hecho; y era muy bueno.
    opciones:
      - id: opcion_mc_6_1_3
        referencia: "Mc 6, 1-3"
        encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Marcos. «¿No es éste el carpintero, el hijo de María?»."
        texto: |
          En aquel tiempo, se marchó Jesús de allí y fue a su pueblo en compañía de sus discípulos. Cuando llegó el sábado, empezó a enseñar en la sinagoga; la multitud que lo oía se preguntaba asombrada: «¿De dónde saca todo eso? ¿Qué sabiduría es ésa que le han enseñado? ¿Y esos milagros de sus manos? ¿No es éste el carpintero, el hijo de María, hermano de Santiago y José y Judas y Simón? Y sus hermanas ¿no viven con nosotros aquí?». Y esto les resultaba escandaloso.
      - id: opcion_si_38_24_34
        referencia: "Si 38, 24-34"
        encabezado: "Escuchad ahora, hermanos, las palabras del libro del Eclesiástico. «La destreza del artesano sostiene la creación»."
        texto: |
          La sabiduría del escriba se adquiere en el sosiego; el que tiene pocas ocupaciones llegará a ser sabio.

          ¿Cómo podrá hacerse sabio el que empuña el arado y se gloría de manejar la aguijada, el que guía los bueyes, se ocupa de sus faenas y solo habla de novillos?

          Pone todo su empeño en abrir surcos y desvela sus cuidados por cebar terneras.

          Lo mismo el artesano y el herrero, que trabajan día y noche; los que graban sellos, se afanan por variar los dibujos y ponen su corazón en reproducir fielmente el modelo; también ellos velan para terminar bien su obra.

          Lo mismo el herrero sentado junto al yunque, atento al trabajo del hierro; el vapor del fuego consume sus carnes y lucha con el calor del horno; el estruendo del martillo ensordece sus oídos y sus ojos están fijos en el modelo del objeto; pone su corazón en acabar perfectamente la obra y vela para adornarla.

          Lo mismo el alfarero sentado en su trabajo, haciendo girar la rueda con los pies; siempre está preocupado por su tarea y cuenta cuidadosamente todas sus piezas. Con su brazo da forma al barro y con sus pies lo amasa; pone su corazón en acabar el barniz y vela por limpiar el horno.

          Todos ellos confían en sus manos y cada uno es hábil en su oficio. Sin ellos no se construiría una ciudad, ni se habitaría ni se recorrería.

          Pero no son buscados para el consejo del pueblo ni sobresalen en la asamblea; no se sientan en la cátedra del juez ni entienden de sentencias. No brillan por su instrucción ni por sus juicios, ni se distinguen por las máximas sapienciales.

          Ellos, en cambio, sostienen la creación eterna, y su oración se refiere al trabajo de su oficio.

      - id: opcion_1ts_4_9_12
        referencia: "1 Ts 4, 9-12"
        encabezado: "Escuchad ahora, hermanos, las palabras de la primera carta del apóstol san Pablo a los Tesalonicenses. «Trabajad con vuestras propias manos»."
        texto: |
          Hermanos:

          Acerca del amor fraterno no necesitáis que os escriba, porque vosotros mismos habéis aprendido de Dios a amaros unos a otros; y así lo practicáis con todos los hermanos de Macedonia.

          Pero os exhortamos, hermanos, a que progreséis más y más. Procurad vivir en paz, ocupaos de vuestros propios asuntos y trabajad con vuestras propias manos, como os lo tenemos mandado; así llevaréis una vida honrada a los ojos de los de fuera y no dependeréis de nadie.

      - id: opcion_2ts_3_6_13
        referencia: "2 Ts 3, 6-13"
        encabezado: "Escuchad ahora, hermanos, las palabras de la segunda carta del apóstol san Pablo a los Tesalonicenses. «El que no quiera trabajar, que no coma»."
        texto: |
          Hermanos:

          Os ordenamos, en nombre del Señor Jesucristo, que os apartéis de todo hermano que viva desordenadamente y no según la tradición que recibió de nosotros.

          Ya sabéis cómo debéis imitar nuestro ejemplo: no vivimos entre vosotros sin trabajar, ni comimos de balde el pan de nadie; al contrario, trabajamos con esfuerzo y fatiga día y noche para no ser gravosos a ninguno de vosotros.

          Y no porque no tuviéramos derecho, sino para daros en nosotros un modelo que imitar.

          Porque, cuando estábamos entre vosotros, os mandábamos esto: «El que no quiera trabajar, que no coma».

          Porque nos hemos enterado de que algunos viven desordenadamente, sin trabajar, ocupándose en cosas que no les corresponden.

          A esos les mandamos y exhortamos, por el Señor Jesucristo, que trabajen con tranquilidad para ganarse el pan que comen.

          Y vosotros, hermanos, no os canséis de hacer el bien.

      - id: opcion_mt_6_25_34
        referencia: "Mt 6, 25-34"
        encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Mateo. «Buscad primero el reino de Dios y su justicia»."
        texto: |
          En aquel tiempo, dijo Jesús a sus discípulos:

          «Por eso os digo: no estéis agobiados por la vida pensando qué vais a comer o beber, ni por el cuerpo pensando con qué os vais a vestir. ¿No vale más la vida que el alimento y el cuerpo que el vestido?

          Mirad los pájaros del cielo: no siembran ni siegan, ni almacenan en graneros, y, sin embargo, vuestro Padre celestial los alimenta. ¿No valéis vosotros más que ellos?

          ¿Quién de vosotros, a fuerza de agobiarse, podrá añadir una sola hora al tiempo de su vida?

          ¿Y por el vestido, por qué os preocupáis? Fijaos cómo crecen los lirios del campo: ni trabajan ni hilan; y os digo que ni Salomón, en todo su esplendor, se vistió como uno de ellos.

          Pues si a la hierba del campo, que hoy es y mañana se echa al horno, Dios la viste así, ¿no hará mucho más por vosotros, hombres de poca fe?

          No andéis agobiados pensando qué vais a comer, o qué vais a beber, o con qué os vais a vestir. Los gentiles se afanan por todas esas cosas. Ya sabe vuestro Padre celestial que tenéis necesidad de todo eso.

          Buscad primero el reino de Dios y su justicia, y todo lo demás se os dará por añadidura.

          Por tanto, no os agobiéis por el mañana, porque el mañana traerá su propio agobio. A cada día le basta su desgracia».

      - id: opcion_mt_25_14_29
        referencia: "Mt 25, 14-29"
        encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Mateo. «Has sido fiel en lo poco; pasa al banquete de tu señor»."
        texto: |
          En aquel tiempo, dijo Jesús a sus discípulos esta parábola:

          «Un hombre, al irse de viaje, llamó a sus siervos y les dejó encargados de sus bienes.

          A uno le dejó cinco talentos, a otro dos, a otro uno; a cada cual según su capacidad. Luego se marchó.

          El que recibió cinco talentos fue enseguida a negociar con ellos y ganó otros cinco. El que recibió dos hizo lo mismo y ganó otros dos. En cambio, el que recibió uno hizo un hoyo en la tierra y escondió el dinero de su señor.

          Al cabo de mucho tiempo volvió el señor de aquellos siervos y se puso a ajustar las cuentas con ellos.

          Se acercó el que había recibido cinco talentos y presentó otros cinco, diciendo:

          —"Señor, cinco talentos me dejaste; mira, he ganado otros cinco".

          Su señor le dijo:

          —"Muy bien, siervo bueno y fiel; has sido fiel en lo poco, te confiaré mucho más; entra en el gozo de tu señor".

          Se acercó luego el de los dos talentos y dijo:

          —"Señor, dos talentos me dejaste; mira, he ganado otros dos".

          Su señor le dijo:

          —"Muy bien, siervo bueno y fiel; has sido fiel en lo poco, te confiaré mucho más; entra en el gozo de tu señor".

          Finalmente se acercó el que había recibido un talento y dijo:

          —"Señor, sabía que eres exigente, que siegas donde no sembraste y recoges donde no esparciste; por eso tuve miedo y fui a esconder tu talento bajo tierra. Aquí tienes lo tuyo".

          El señor le respondió:

          —"Siervo malo y perezoso. ¿Sabías que siego donde no sembré y recojo donde no esparcí? Pues debías haber puesto mi dinero en el banco, para que al volver yo recuperase lo mío con los intereses.

          Quitadle el talento y dádselo al que tiene diez.

          Porque al que tiene se le dará y le sobrará; pero al que no tiene, aun lo que tiene se le quitará".

      - id: opcion_lc_16_9_12
        referencia: "Lc 16, 9-12"
        encabezado: "Escuchad ahora, hermanos, las palabras del santo Evangelio según san Lucas. «El que es de fiar en lo menudo también en lo importante es de fiar»."
        texto: |
          En aquel tiempo, dijo Jesús a sus discípulos:

          «Ganaos amigos con el dinero injusto, para que, cuando os falte, os reciban en las moradas eternas.

          El que es de fiar en lo menudo también en lo importante es de fiar; y el que no es honrado en lo menudo tampoco en lo importante es honrado.

          Si no fuisteis de fiar en el injusto dinero, ¿quién os confiará el verdadero bien?

          Y si no fuisteis de fiar en lo ajeno, ¿lo vuestro quién os lo dará?».

  - id: respuesta_palabra_de_dios
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Palabra de Dios."

  - id: rubrica_675_salmo
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Según las circunstancias, se puede decir o cantar un salmo responsorial u otro canto adecuado."

  - id: salmo_89_90
    tipo: salmo
    actor: lector
    obligatorio: false
    referencia: "Sal 89 (90), 2. 3-4. 12-13. 14 y 16 (R.: cf. 17)"
    estribillo: "Haz prósperas, Señor, las obras de nuestras manos."
    estrofas:
      - "Antes que naciesen los montes o fuera engendrado el orbe de la tierra, desde siempre y por siempre tú eres Dios."
      - "Tú reduces el hombre a polvo, diciendo: «Retornad, hijos de Adán». Mil años en tu presencia son un ayer que pasó; una vela nocturna."
      - "Enséñanos a calcular nuestros años, para que adquiramos un corazón sensato. Vuélvete, Señor, ¿hasta cuándo? Ten compasión de tus siervos."
      - "Por la mañana sácianos de tu misericordia, y toda nuestra vida será alegría y júbilo. Que tus siervos vean tu acción, y sus hijos tu gloria."
    opciones:
      - id: salmo_103_104
        referencia: "Sal 103 (104), 1ab y 5. 14-15. 23-24"
        estribillo: "Gloria a Dios para siempre, goce el Señor con sus obras."

  - id: rubrica_677_exhortacion
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "El celebrante, según las circunstancias, exhorta brevemente a los presentes, explicándoles la lectura bíblica, para que perciban por la fe el significado de la celebración."

  - id: rubrica_titulo_preces
    tipo: titulo
    actor: celebrante
    obligatorio: false
    texto: "Preces"

  - id: rubrica_678_preces_intro
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Si se estima oportuno, antes de la oración de bendición puede hacerse la plegaria común. Entre las invocaciones que aquí se proponen, el celebrante puede seleccionar las que le parezcan más adecuadas o añadir otras más directamente relacionadas con las circunstancias del momento."

  - id: preces_obras_de_nuestras_manos
    tipo: preces
    actor: celebrante
    obligatorio: false
    invitacion: "Dios, nuestro Señor, que creó el mundo y lo llenó de maravillas como signo de su poder, santificó también en sus orígenes el trabajo del hombre, para que éste, sometiéndose humildemente a la bondad del Creador, se dedicara con perseverancia a perfeccionar de día en día la obra de la creación. Roguémosle, pues, diciendo:"
    respuesta_fija: "Guía, Señor, las obras de nuestras manos."
    invocaciones:
      - invocacion: "Bendito seas, Señor, que nos has dado la ley del trabajo, para que, con nuestra inteligencia y nuestros brazos, nos dediquemos con empeño a perfeccionar las cosas creadas."
        respuesta: "Guía, Señor, las obras de nuestras manos."
      - invocacion: "Bendito seas, Señor, que quisiste que tu Hijo, hecho hombre por nosotros, trabajara como humilde artesano."
        respuesta: "Guía, Señor, las obras de nuestras manos."
      - invocacion: "Bendito seas, Señor, que has hecho que en Cristo nos fuera llevadero el yugo y ligera la carga de nuestro trabajo."
        respuesta: "Guía, Señor, las obras de nuestras manos."
      - invocacion: "Bendito seas, Señor, que en tu providencia nos exiges que procuremos hacer nuestro trabajo con la máxima perfección."
        respuesta: "Guía, Señor, las obras de nuestras manos."
      - invocacion: "Bendito seas, Señor, que te dignas aceptar nuestro trabajo como una ofrenda y como una penitencia saludable, motivo de alegría para los hermanos y ocasión de prestar ayuda a los pobres."
        respuesta: "Guía, Señor, las obras de nuestras manos."
      - invocacion: "Bendito seas, Señor, que elevas a la sublime dignidad de la Eucaristía el pan y el vino, fruto de nuestro trabajo."
        respuesta: "Guía, Señor, las obras de nuestras manos."

  - id: rubrica_titulo_oracion_bendicion
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Oración de bendición"

  - id: rubrica_679_sin_preces
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Cuando no se dicen las preces, antes de la oración de bendición, el celebrante invita a todos a orar, para que imploren la ayuda divina, diciendo:"

  - id: invitacion_oremos_679
    tipo: monicion
    actor: celebrante
    obligatorio: false
    texto: "Oremos."

  - id: rubrica_silencio_679
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Y, según las circunstancias, todos oran durante algún tiempo en silencio."

  - id: rubrica_680
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "El celebrante, con las manos extendidas, dice la oración de bendición correspondiente al tipo de local:"

  - id: bendicion_lugar_de_trabajo
    tipo: bendicion
    actor: celebrante
    obligatorio: true
    opciones:
      - id: formula_laboratorio
        encabezado: "a) Bendición de un laboratorio"
        texto: "Oh, Dios, que en el designio de tu providencia, aceptas bondadosamente perfeccionar con tus bendiciones todas las actividades de los hombres, tanto las corporales como las intelectuales, te pedimos que todos los que en este lugar traten, con sus experimentos, de estudiar los males y hallar los remedios, puedan, con tu ayuda, determinar con precisión lo que investiguen y realizar con éxito el fruto de su estudio. Por Jesucristo, nuestro Señor."
      - id: formula_taller
        encabezado: "b) Bendición de un taller"
        texto: "Oh, Dios, tu Hijo, con el trabajo de sus manos, elevó la dignidad del trabajo humano y nos concedió el don inestimable de colaborar con nuestro trabajo a su obra redentora; concede a tus fieles la bendición que esperan de ti, para que, dedicándose a transformar con habilidad las cosas que tú has creado, reconozcan su dignidad y se alegren de aliviar con su esfuerzo las necesidades de la familia humana, para alabanza de tu gloria. Por Jesucristo, nuestro Señor."
      - id: formula_tienda_comercio
        encabezado: "c) Bendición de una tienda de comercio"
        texto: "Dios, Padre providentísimo, que pusiste en manos del hombre la tierra y sus productos para que contribuyera con su trabajo a que los bienes creados alcancen a todos, bendice a los que usen este local y haz que, observando en sus compras y ventas la justicia y la caridad, puedan alegrarse de contribuir al bien común y al progreso de la comunidad humana. Por Jesucristo, nuestro Señor."

  - id: respuesta_amen_oracion_bendicion
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_681_aspersion
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Después de la oración de bendición, el celebrante rocía con agua bendita a los presentes y el local, mientras se interpreta un canto adecuado."

  - id: rubrica_titulo_conclusion
    tipo: titulo
    actor: celebrante
    obligatorio: true
    texto: "Conclusión del rito"

  - id: rubrica_682
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "El celebrante concluye el rito, diciendo, con las manos extendidas sobre los presentes:"

  - id: conclusion_mirada_bondadosa
    tipo: conclusion
    actor: celebrante
    obligatorio: true
    texto: "Dios, Padre de bondad, que nos ha mandado ayudarnos en todo como verdaderos hermanos, dirija su mirada bondadosa sobre vosotros y sobre todos los que entren aquí."

  - id: respuesta_amen_conclusion_682a
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_682_luego_dice
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Luego dice:"

  - id: bendicion_final_trinitaria
    tipo: bendicion
    actor: celebrante
    obligatorio: true
    texto: "Y a todos vosotros, que estáis aquí presentes, os bendiga Dios todopoderoso, Padre, Hijo ✠ y Espíritu Santo."

  - id: respuesta_amen_conclusion_682b
    tipo: respuesta
    actor: asamblea
    obligatorio: true
    texto: "Amén."

  - id: rubrica_683_canto
    tipo: rubrica
    actor: celebrante
    obligatorio: false
    texto: "Es aconsejable terminar el rito con un canto adecuado."
